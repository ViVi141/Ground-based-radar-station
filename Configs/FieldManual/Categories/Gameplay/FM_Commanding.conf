SCR_FieldManualConfigCategory {
 m_aEntries {
  SCR_FieldManualConfigEntry_Standard "{69FCEDCEB0100001}" {
   m_sTitle "Ground Radar - Quick Start"
   m_Image "{69FCEDCEA0040001}UI/Textures/EditorPreviews/Auto/Compositions/Misc/FreeRoamBuilding/E_RadarStation_S_US_01.edds"
   m_aContent {
    SCR_FieldManualPiece_Header "{69FCEDCEB0100011}" {
     m_sText "Ground Radar - Quick Start"
    }
    SCR_FieldManualPiece_Text "{69FCEDCEB0100012}" {
     m_sText "GBRS turns the official approach-radar meshes into buildable Conflict / Game Master ground stations. Detection runs through Radar Development Framework (RDF). Visuals are AN/TPN-19 (US) or Tesla RPL-5 (USSR); RF is Conflict-balanced, not real approach-handbook ranges."
    }
    SCR_FieldManualPiece_Text "{69FCEDCEB0100013}" {
     m_sText "1. Place from a construction truck or base build menu (sergeant, cost 450). A work pad appears first. Finish shoveling (build value 250). From a base terminal you also spend 100 HQ composition points (dual gate: supplies AND points). Truck pads do not check HQ points."
    }
    SCR_FieldManualPiece_Text "{69FCEDCEB0100014}" {
     m_sText "2. At the generator: power ON (needs supply), then Open Workstation. Forward placement is allowed - the set does not have to sit inside a base."
    }
    SCR_FieldManualPiece_Text "{69FCEDCEB0100015}" {
     m_sText "3. Tune your handheld to RADAR NET (US 45.6 MHz / USSR 39.6 MHz) to hear air and counter-battery voice. Untuned friendlies hear nothing."
    }
    SCR_FieldManualPiece_Text "{69FCEDCEB0100016}" {
     m_sText "US: AN/TPN-19 look, 12 km air search (~10 RPM, ~2.5 deg beam), 8 km WLR. USSR: RPL-5 look, 16 km VHF-style early warning (~6 RPM, ~6 deg beam), 10 km WLR. US is tighter/shorter; USSR is wider/farther."
    }
   }
  }
  SCR_FieldManualConfigEntry_Standard "{69FCEDCEB0100002}" {
   m_sTitle "Ground Radar - Workstation"
   m_Image "{F2196E35CB708A41}UI/Textures/GBRS/GBRS_PpiFace.edds"
   m_aContent {
    SCR_FieldManualPiece_Header "{69FCEDCEB0100021}" {
     m_sText "Ground Radar - Workstation"
    }
    SCR_FieldManualPiece_Text "{69FCEDCEB0100022}" {
     m_sText "Open the PPI only while the station is powered and you are friendly to its faction. Enemy players cannot operate your set."
    }
    SCR_FieldManualPiece_Text "{69FCEDCEB0100023}" {
     m_sText "PD SEARCH - pulse-Doppler air search. Skin returns only: anonymous azimuth, range, altitude, speed, SNR. No aircraft type names. Radiating radars may show as EMIT when detected. Infantry never paints."
    }
    SCR_FieldManualPiece_Text "{69FCEDCEB0100024}" {
     m_sText "WLR - weapon-locating radar for shells. Full-circle search cues a track, then the dish auto-narrows about +/-40 deg for launch / impact solutions (LCH orange, IMP cyan). About 8 s after the cue fades it returns to all-around scan. Solutions are estimates with error - not exact gun coordinates."
    }
    SCR_FieldManualPiece_Text "{69FCEDCEB0100025}" {
     m_sText "LOCK - auto-acquires nearby vehicles; click a PPI track to designate a lock for fire-control consumer mods (SAM / AAA bridges). Without such a mod, lock is display / bridge state only."
    }
    SCR_FieldManualPiece_Text "{69FCEDCEB0100026}" {
     m_sText "MANUAL - operator knobs for range, scan rate, elevation boresight, and stare bearing. Range and RPM cannot exceed the faction PD SEARCH caps (US 12 km / 10 RPM, USSR 16 km / 6 RPM). RF balance (SNR, clutter, beamwidth, power) stays on the faction preset."
    }
    SCR_FieldManualPiece_Text "{69FCEDCEB0100027}" {
     m_sText "Controls: Up / Down or mouse wheel zoom PPI range. Tab left / right cycle modes. Select confirms. Back closes. OPTICS toggles an optional PIP camera (off by default). TX NET is the station intel transmitter indicator - the handheld net is listen-only."
    }
   }
  }
  SCR_FieldManualConfigEntry_Standard "{69FCEDCEB0100003}" {
   m_sTitle "Ground Radar - RADAR NET"
   m_Image "{69FCEDCEA0040001}UI/Textures/EditorPreviews/Auto/Compositions/Misc/FreeRoamBuilding/E_RadarStation_S_US_01.edds"
   m_aContent {
    SCR_FieldManualPiece_Header "{69FCEDCEB0100031}" {
     m_sText "Ground Radar - RADAR NET"
    }
    SCR_FieldManualPiece_Text "{69FCEDCEB0100032}" {
     m_sText "A powered station that covers a friendly Conflict base transmits new air contacts and in-radius WLR impacts on a locked intel net. This does not set the vanilla base enemy-presence flag, so it will not lock the build button by itself."
    }
    SCR_FieldManualPiece_Text "{69FCEDCEB0100033}" {
     m_sText "US 45.6 MHz (45600 kHz) | USSR 39.6 MHz (39600 kHz) | channel name RADAR NET. Faction crypto. You must tune the net to hear ACP voice or RADAR CONTACT / NET CONTACT tips. Untuned friendlies get nothing."
    }
    SCR_FieldManualPiece_Text "{69FCEDCEB0100034}" {
     m_sText "Local handheld TX/RX radius is about 2 km (AN/PRC-77 class). Farther coverage uses friendly Conflict HQ radios or a hop chain of powered RelayTransceiver assets (GM towers, antennas, command vehicles; up to 24 hops). Handhelds themselves do not hop."
    }
    SCR_FieldManualPiece_Text "{69FCEDCEB0100035}" {
     m_sText "Voice: air = grid / heading / altitude; WLR = launch grid / impact grid / ETA (English or Russian slices). After construction, same-faction players get a one-shot tune briefing. Do not use platoon nets (US 48.0 / USSR 42.0). CHANNEL key does not work on this locked net - tune frequency manually."
    }
    SCR_FieldManualPiece_Text "{69FCEDCEB0100036}" {
     m_sText "Forward truck-built radars outside a base radius still detect locally on the workstation, but only stations covering a friendly base push intel-net voice to the faction."
    }
   }
  }
  SCR_FieldManualConfigEntry_Standard "{69FCEDCEB0100004}" {
   m_sTitle "Ground Radar - Supply & Capture"
   m_Image "{69FCEDCEA0040002}UI/Textures/EditorPreviews/Auto/Compositions/Misc/FreeRoamBuilding/E_RadarStation_S_USSR_01.edds"
   m_aContent {
    SCR_FieldManualPiece_Header "{69FCEDCEB0100041}" {
     m_sText "Ground Radar - Supply & Capture"
    }
    SCR_FieldManualPiece_Text "{69FCEDCEB0100042}" {
     m_sText "While powered the station drains 15 supply every 25 seconds (~0.6 / s). Order: covering friendly Conflict base stockpile (station must be inside that base radius), then local bunker (capacity 400), then a still-linked construction truck."
    }
    SCR_FieldManualPiece_Text "{69FCEDCEB0100043}" {
     m_sText "Power-on is refused if the first tick cannot be paid. Running dry powers the set off and closes the workstation."
    }
    SCR_FieldManualPiece_Text "{69FCEDCEB0100044}" {
     m_sText "Flag flip (actual capture, not merely contested firefight): station powers off, affiliation follows the occupier, they may power it from their stockpile, previous faction loses power and PPI. Hardware mesh does not swap (a US pad stays AN/TPN-19)."
    }
    SCR_FieldManualPiece_Text "{69FCEDCEB0100045}" {
     m_sText "While the base is only contested (fight not finished), the radar still belongs to the defenders. Truck-built radars outside a base radius keep the builder faction forever - distant base flips do not hand them over. Enemies cannot operate them; only wreck or shovel the wreck."
    }
    SCR_FieldManualPiece_Text "{69FCEDCEB0100046}" {
     m_sText "Damage: combat can wreck the station (it stays destroyed/burning). Intact finished stations are not shovel-dismantled. Destroyed wrecks: hold an entrenching tool and use Dismantle wreck. Unfinished pads block vanilla dismantle; clear them with the GBRS shovel path once wrecked."
    }
   }
  }
  SCR_FieldManualConfigEntry_Standard "{69FCEDCEB0100005}" {
   m_sTitle "Ground Radar - Reading the Scope"
   m_Image "{F2196E35CB708A41}UI/Textures/GBRS/GBRS_PpiFace.edds"
   m_aContent {
    SCR_FieldManualPiece_Header "{69FCEDCEB0100051}" {
     m_sText "Ground Radar - Reading the Scope"
    }
    SCR_FieldManualPiece_Text "{69FCEDCEB0100052}" {
     m_sText "Local search plots are anonymous skin returns - no secondary radar / IFF interrogation on the contact list. Use azimuth, range, altitude, speed, and SNR to judge threats."
    }
    SCR_FieldManualPiece_Text "{69FCEDCEB0100053}" {
     m_sText "ANON = unknown air return. EMIT = radiating radar (when detected as an emitter plot). SHELL = WLR projectile with launch / impact estimates (not which gun). Hovering helicopters can look nearly stationary on speed readout."
    }
    SCR_FieldManualPiece_Text "{69FCEDCEB0100054}" {
     m_sText "Multi-station datalink is separate: powered stations publish confirmed tracks into a shared hub. The network overlay can color fused tracks friend / foe / neutral against the station faction. That does not rename local ANON plots."
    }
    SCR_FieldManualPiece_Text "{69FCEDCEB0100055}" {
     m_sText "Terrain matters: hills and knife-edge diffraction can hide or weaken returns (NLOS). A clear PPI does not always mean clear sky - check map relief and antenna scan."
    }
    SCR_FieldManualPiece_Text "{69FCEDCEB0100056}" {
     m_sText "Requires RDF 1.1.6+. Contact list columns: NR/AZ/RNG/ALT/SPD/TYPE/SNR in air modes; WLR list shows ETA/TOF style fields for fire solutions."
    }
   }
  }
  SCR_FieldManualConfigEntry_Standard "{69FCEDCEB0100006}" {
   m_sTitle "Ground Radar - Interference & ECM"
   m_Image "{F2196E35CB708A41}UI/Textures/GBRS/GBRS_PpiFace.edds"
   m_aContent {
    SCR_FieldManualPiece_Header "{69FCEDCEB0100061}" {
     m_sText "Ground Radar - Interference & ECM"
    }
    SCR_FieldManualPiece_Text "{69FCEDCEB0100062}" {
     m_sText "When another radar (or jammer) is radiating nearby, your receiver can pick up extra noise. The PPI may show a status line such as JAMMING ECM SLB. That means the ECCM decision layer detected jam-to-noise pressure and selected a countermeasure."
    }
    SCR_FieldManualPiece_Text "{69FCEDCEB0100063}" {
     m_sText "SLB = sidelobe blanking: blank interference that enters through the antenna sidelobes; keep mainlobe energy. Other ECCM tokens you may see: PRF (PRF agility), FREQ (frequency agility), BURN (burn-through). Only SLB is fully wired as a receiver response in this product path; others are reported decisions."
    }
    SCR_FieldManualPiece_Text "{69FCEDCEB0100064}" {
     m_sText "Important: JAMMING on screen does NOT always paint the other radar's position. Noise coupling and ECCM status are separate from drawing an EMIT blip. ESM receive is off in the default GBRS search preset, so emitter geolocation on the PPI is uncommon."
    }
    SCR_FieldManualPiece_Text "{69FCEDCEB0100065}" {
     m_sText "You may therefore see JAMMING / SLB with an empty PPI toward the other site - especially if the other dish is off your main beam, only couples through sidelobes (then blanked), or is same-faction mutual interference. That is expected with current balance."
    }
    SCR_FieldManualPiece_Text "{69FCEDCEB0100066}" {
     m_sText "When an emitter IS detected as a plot/track, type shows EMIT and the PPI may mark it with a distinct ring / JAM label. Own-site emissions within ~50 m are ignored so the station does not self-jam its own scope."
    }
    SCR_FieldManualPiece_Text "{69FCEDCEB0100067}" {
     m_sText "Practical tip: two friendly powered radars close together can raise each other's noise floor. Space them, or power one down, if scopes look dirty without contacts."
    }
   }
  }
  SCR_FieldManualConfigEntry_Standard "{69FCEDCEB0100007}" {
   m_sTitle "Ground Radar - US vs USSR"
   m_Image "{69FCEDCEA0040002}UI/Textures/EditorPreviews/Auto/Compositions/Misc/FreeRoamBuilding/E_RadarStation_S_USSR_01.edds"
   m_aContent {
    SCR_FieldManualPiece_Header "{69FCEDCEB0100071}" {
     m_sText "Ground Radar - US vs USSR"
    }
    SCR_FieldManualPiece_Text "{69FCEDCEB0100072}" {
     m_sText "US (AN/TPN-19 mesh): pulse-Doppler SHORAD-style search - 12 km, ~10 RPM, ~2.5 deg azimuth beam, tighter gates. Better for precise short-range air picture. WLR 8 km, ~24 deg beam class."
    }
    SCR_FieldManualPiece_Text "{69FCEDCEB0100073}" {
     m_sText "USSR (Tesla RPL-5 mesh): VHF early-warning style front end - 16 km, ~6 RPM, ~6 deg azimuth beam, coarser readout. Better for longer early warning. WLR 10 km, ~30 deg beam class."
    }
    SCR_FieldManualPiece_Text "{69FCEDCEB0100074}" {
     m_sText "Both use 360 deg mechanical WLR search with auto sector narrow after a shell track is cued. Antenna motion differs visually (US whole-mesh yaw vs USSR antenna_rotation bone) but both are playable search products, not GCA approach radars."
    }
    SCR_FieldManualPiece_Text "{69FCEDCEB0100075}" {
     m_sText "Same campaign cost (450), sergeant rank, build value 250, and 100 HQ composition points from a base terminal. Choose by doctrine: US for tighter local defense picture, USSR for longer early warning."
    }
   }
  }
 }
}
